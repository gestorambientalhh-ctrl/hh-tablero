  /* botones transparentes sobre cada número impreso */
  .cell{position:absolute;border:none;background:transparent;cursor:pointer;border-radius:12px;padding:0;
    transition:transform .1s;}
  .cell:hover{transform:scale(1.05);background:rgba(255,255,255,.12);}
  .cell .veil{position:absolute;inset:0;border-radius:12px;display:none;
    background:rgba(20,40,25,.66);align-items:center;justify-content:center;}
  .cell.done{cursor:default;}
  .cell.done:hover{transform:none;background:transparent;}
  .cell.done .veil{display:flex;}
  .cell.done .veil::after{content:"✓";color:#fff;font-size:clamp(14px,2.4vw,30px);font-weight:800;}
  /* contadores en vivo (tapan los 0 impresos) */
  .counter{position:absolute;transform:translate(-50%,-50%);
    background:#f1f0ec;color:var(--verde);font-weight:800;
    font-size:clamp(10px,1.35vw,19px);padding:1px 6px;border-radius:6px;line-height:1.1;}
  /* hotspot nuevo juego */
  .newgame{position:absolute;background:transparent;border:none;cursor:pointer;border-radius:30px;}
  .newgame:hover{background:rgba(255,255,255,.14);}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,30,20,.8);display:none;
    align-items:center;justify-content:center;padding:18px;z-index:50;}
  .overlay.show{display:flex;}
  .card{background:#fff;border-radius:20px;max-width:640px;width:100%;padding:30px 28px;
    box-shadow:0 16px 50px rgba(0,0,0,.4);animation:pop .2s ease;border-top:6px solid var(--verde);}
  @keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
  .qtag{display:inline-block;background:var(--verde);color:#fff;font-size:12px;font-weight:700;
    letter-spacing:1px;padding:5px 12px;border-radius:20px;margin-bottom:14px;}
  .question{font-size:21px;font-weight:700;line-height:1.35;margin-bottom:20px;color:var(--navy);}
  .options{display:flex;flex-direction:column;gap:11px;}
  .opt{text-align:left;border:2px solid #dfe5e0;background:#fff;border-radius:12px;padding:13px 16px;
    font-size:16px;cursor:pointer;color:var(--navy);transition:border-color .15s,background .15s;}
  .opt:hover{border-color:var(--teal);}
  .opt.correct{border-color:var(--ok);background:#e7f3ec;font-weight:700;}
  .opt.wrong{border-color:var(--bad);background:#f7e9e9;}
  .opt:disabled{cursor:default;}
  .feedback{margin-top:18px;font-size:15px;line-height:1.45;display:none;padding:14px 16px;border-radius:12px;}
  .feedback.show{display:block;}
  .feedback.good{background:#e7f3ec;color:var(--verde);}
  .feedback.no{background:#f7e9e9;color:var(--bad);}
  .feedback .ans{color:var(--navy);}
  .modal-actions{margin-top:22px;display:flex;justify-content:flex-end;}
  .btn-dark{background:var(--navy);color:#fff;border:none;border-radius:30px;padding:10px 20px;
    font-weight:700;font-size:14px;cursor:pointer;}
</style>

let preguntas=[], actual=-1;
function barajar(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function nuevoJuego(){
  preguntas=barajar(BANCO);
  for(let i=0;i<preguntas.length;i++){const c=document.getElementById("cell-"+i);if(c)c.classList.remove("done");}
  cerrar();
}
function abrir(i){
  const cell=document.getElementById("cell-"+i);
  if(!cell||cell.classList.contains("done"))return;
  actual=i;const p=preguntas[i];
  document.getElementById("qtag").textContent="PREGUNTA "+(i+1);
  document.getElementById("question").textContent=p.q;
  const box=document.getElementById("optionsBox");box.innerHTML="";
  barajar(p.o.map((_,k)=>k)).forEach(k=>{
    const b=document.createElement("button");b.className="opt";b.textContent=p.o[k];
    b.onclick=()=>responder(k,b);box.appendChild(b);
  });
  const fb=document.getElementById("feedback");fb.className="feedback";fb.innerHTML="";
  document.getElementById("closeBtn").style.display="none";
  document.getElementById("ov").classList.add("show");
}
function responder(k,btn){
  const p=preguntas[actual];
  document.querySelectorAll("#optionsBox .opt").forEach(o=>{o.disabled=true;if(o.textContent===p.o[p.a])o.classList.add("correct");});
  const fb=document.getElementById("feedback");
  if(k===p.a){fb.className="feedback show good";fb.innerHTML="✔ ¡Correcto!";}
  else{btn.classList.add("wrong");fb.className="feedback show no";fb.innerHTML="✗ No era esa. <span class='ans'>Respuesta correcta: <b>"+p.o[p.a]+"</b></span>";}
  document.getElementById("cell-"+actual).classList.add("done");
  document.getElementById("closeBtn").style.display="inline-block";
}
function cerrar(){document.getElementById("ov").classList.remove("show");}
document.getElementById("ov").addEventListener("click",function(e){if(e.target===this)cerrar();});
nuevoJuego();
